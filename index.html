<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لیست کارها</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="theme-switch">
        <button id="theme-toggle" title="تغییر تم">🌙</button>
      </div>

      <h1>📝 لیست کارها</h1>

      <form id="todo-form">
        <input
          type="text"
          id="todo-input"
          placeholder="یه کار جدید بنویس..."
          required
        />
        <button type="submit">اضافه کن</button>
      </form>

      <div class="stats">
        <span>کل: <strong id="total-count">0</strong></span>
        <span>انجام‌شده: <strong id="done-count">0</strong></span>
        <span>باقی‌مونده: <strong id="remaining-count">0</strong></span>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">همه</button>
        <button class="filter-btn" data-filter="active">انجام‌نشده</button>
        <button class="filter-btn" data-filter="done">انجام‌شده</button>
      </div>

      <ul id="todo-list"></ul>

      <button id="clear-all" class="clear-all">🗑️ پاک کردن همه</button>

      <p id="empty-msg">هنوز کاری اضافه نکردی! 🎉</p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
