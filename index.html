<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لیست کارها</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="theme-switch">
        <button id="theme-toggle" title="تغییر تم">🌙</button>
      </div>

      <h1>📝 لیست کارها</h1>

      <form id="todo-form">
        <input
          type="text"
          id="todo-input"
          placeholder="یه کار جدید بنویس..."
          required
        />
        <button type="submit">اضافه کن</button>
      </form>

      <ul id="todo-list"></ul>

      <p id="empty-msg">هنوز کاری اضافه نکردی! 🎉</p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
